<text x="186" y="426" font-size="10" font-weight="600" fill="#52514e">? How many workers should run at once?</text>
<text x="186" y="448" font-size="10" font-weight="500" fill="#0b0b0b">✓ 6, one below what the probe held — the probe used</text>
<text x="186" y="462" font-size="10" font-weight="500" fill="#0b0b0b">tiny requests; real ones are 2200 tokens each, so 6</text>
<text x="186" y="476" font-size="10" font-weight="500" fill="#0b0b0b">caps the burst</text>
<text x="186" y="498" font-size="10" font-weight="400" fill="#52514e" text-decoration="line-through">✕ 4, a conservative default — the probe showed 7 was</text>
<text x="186" y="512" font-size="10" font-weight="400" fill="#52514e" text-decoration="line-through">fine, and 4 leaves most of the win unclaimed</text>
<text x="186" y="534" font-size="10" font-weight="400" fill="#52514e" text-decoration="line-through">✕ 8, the highest the plan mentioned — never exercised</text>
<text x="186" y="548" font-size="10" font-weight="400" fill="#52514e" text-decoration="line-through">above 7, and it multiplies the token burst further</text>
